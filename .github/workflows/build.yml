name: Build & Release

# Сборка только при выпуске версии (тег v*) или вручную: в приватном репозитории
# минуты macOS-сборки GitHub считает с коэффициентом ×10.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза, например v2.0.0 (пусто — только собрать, без релиза)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  macos:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Check version matches release
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          V="${VERSION#v}"
          grep -q "<string>$V</string>" macos/Resources/Info.plist || { echo "Info.plist version != $V"; exit 1; }
          grep -q "<Version>$V</Version>" windows/RedCast.csproj || { echo "RedCast.csproj version != $V"; exit 1; }

      - name: Build RedCast.app
        working-directory: macos
        run: bash build_app.sh

      - name: Self-test (download → sign → install → verify)
        run: macos/build/RedCast.app/Contents/MacOS/RedCast --self-test

      - name: Package
        run: |
          cd macos/build
          ditto -c -k --sequesterRsrc --keepParent RedCast.app "$GITHUB_WORKSPACE/RedCast-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: RedCast-macOS
          path: RedCast-macOS.zip

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish RedCast.exe
        run: dotnet publish windows/RedCast.csproj -c Release -o out/RedCast

      - name: Self-test (download → install → verify)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath out/RedCast/RedCast.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content "$env:APPDATA/RedCast/selftest.log"
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }

      - name: Package
        shell: pwsh
        run: |
          Copy-Item windows/README.md out/RedCast/README.md
          Compress-Archive -Path out/RedCast -DestinationPath RedCast-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RedCast-Windows
          path: RedCast-Windows.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: RedCast ${{ inputs.version || github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*.zip
