name: Build & Release

# Сборка только при выпуске версии (тег v*) или вручную: в приватном репозитории
# минуты macOS-сборки GitHub считает с коэффициентом ×10.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build RedCast.app
        working-directory: macos
        run: bash build_app.sh

      - name: Package
        run: |
          cd macos/build
          ditto -c -k --sequesterRsrc --keepParent RedCast.app "$GITHUB_WORKSPACE/RedCast-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: RedCast-macOS
          path: RedCast-macOS.zip

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish RedCast.exe
        run: dotnet publish windows/RedCast.csproj -c Release -o out/RedCast

      - name: Package
        shell: pwsh
        run: |
          Copy-Item windows/README.md out/RedCast/README.md
          Compress-Archive -Path out/RedCast -DestinationPath RedCast-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RedCast-Windows
          path: RedCast-Windows.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: RedCast ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*.zip
